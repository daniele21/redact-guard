name: Validate PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lightweight test dependencies
        run: python -m pip install "pydantic>=2.7" "diskcache>=5.6.3" "pyyaml>=6.0.1" "fastapi>=0.111"
      - name: Compile Python sources
        run: python -m compileall -q anonimizer
      - name: Korgis contract tests
        run: python -m unittest discover -s anonimizer/tests -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting/parsing
        run: |
          cargo fmt --check --manifest-path sidecar/Cargo.toml
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Check lightweight sidecar launcher
        run: cargo check --manifest-path sidecar/Cargo.toml
