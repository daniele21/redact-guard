name: Validate PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lightweight test dependencies
        run: python -m pip install "pydantic>=2.7" "diskcache>=5.6.3" "pyyaml>=6.0.1" "fastapi>=0.111"
      - name: Compile Python sources
        run: python -m compileall -q anonimizer
      - name: Korgis contract tests
        run: python -m unittest discover -s anonimizer/tests -p "test_*.py"
      - name: Managed packaging contract
        run: python scripts/verify-managed-packaging.py

  managed-korgis-contract:
    name: Managed Korgis wheel contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Korgis runtime contract
        id: korgis
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          payload = json.loads(Path(".engineering/korgis-runtime.json").read_text())
          print(f"repository={payload['repository']}")
          print(f"commit={payload['commit']}")
          print(f"request_evidence_protocol={payload['request_evidence_protocol']}")
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.korgis.outputs.repository }}
          ref: ${{ steps.korgis.outputs.commit }}
          path: korgis-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build pinned Korgis wheel
        run: |
          python -m pip install "build==1.2.2.post1"
          python -m build --wheel --outdir korgis-dist korgis-candidate
      - name: Verify RedactGuard managed-runtime contract
        run: |
          wheel="$(find korgis-dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/verify-korgis-wheel.py \
            "$wheel" \
            --expected-commit "${{ steps.korgis.outputs.commit }}"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget
      - name: Check Rust formatting/parsing
        run: |
          cargo fmt --check --manifest-path sidecar/Cargo.toml
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Test lightweight sidecar launcher
        run: cargo test --manifest-path sidecar/Cargo.toml
      - name: Stage sidecar binary for Tauri
        run: |
          cargo build --manifest-path sidecar/Cargo.toml
          mkdir -p src-tauri/binaries
          cp sidecar/target/debug/redactguard-server \
            src-tauri/binaries/redactguard-server-x86_64-unknown-linux-gnu
      - name: Check Tauri managed runtime orchestration
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Check packaging script syntax
        run: bash -n scripts/build-sidecar.sh
