name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            python-platform: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-platform: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for pinned Korgis artifact
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read pinned Korgis runtime contract
        id: korgis
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          payload = json.loads(Path(".engineering/korgis-runtime.json").read_text())
          print(f"repository={payload['repository']}")
          print(f"commit={payload['commit']}")
          print(f"request_evidence_protocol={payload['request_evidence_protocol']}")
          PY

      - name: Checkout pinned Korgis source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.korgis.outputs.repository }}
          ref: ${{ steps.korgis.outputs.commit }}
          path: korgis-candidate

      - name: Build and verify pinned Korgis wheel
        shell: bash
        run: |
          python -m pip install "build==1.2.2.post1"
          python -m build --wheel --outdir korgis-dist korgis-candidate
          wheel="$(find korgis-dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/verify-korgis-wheel.py \
            "$wheel" \
            --expected-commit "${{ steps.korgis.outputs.commit }}"
          sha="$(python - "$wheel" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(digest)
          PY
          )"
          echo "KORGIS_WHEEL=$(pwd)/$wheel" >> "$GITHUB_ENV"
          echo "KORGIS_WHEEL_SHA256=$sha" >> "$GITHUB_ENV"
          echo "KORGIS_SOURCE_COMMIT=${{ steps.korgis.outputs.commit }}" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            sidecar -> target

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build sidecar & resources
        shell: bash
        env:
          REDACTGUARD_BUILD_TARGET: ${{ matrix.target }}
        run: pnpm tauri:build-sidecar

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RedactGuard ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
