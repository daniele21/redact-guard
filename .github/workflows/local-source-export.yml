name: Temporary local deps export
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-source-export.yml"
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .ci-venv
      - run: .ci-venv/bin/python -m pip install "pydantic>=2.7" "diskcache>=5.6.3" "pyyaml>=6.0.1" "fastapi>=0.111"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: local-ci-deps
          path: |
            .ci-venv
            node_modules
          include-hidden-files: true
          retention-days: 1
