name: Temporary local rust toolchain export
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-source-export.yml"
jobs:
  rust-deps:
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.ci-cargo
      RUSTUP_HOME: ${{ github.workspace }}/.ci-rustup
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
          "$CARGO_HOME/bin/rustup" component add rustfmt
      - uses: actions/upload-artifact@v4
        with:
          name: local-rust-toolchain
          path: |
            .ci-cargo
            .ci-rustup
          include-hidden-files: true
          retention-days: 1
