[package]
name = "redactguard"
version = "0.1.0"
description = "RedactGuard — Local-first document anonymization"
authors = ["RedactGuard"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time", "process", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
portpicker = "0.1"
